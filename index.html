<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f4f5fa">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src https://script.google.com https://*.googleusercontent.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>PPR Order</title>
<style>
:root{
  --canvas:#f4f5fa; --card:#fff; --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#a1a1a8; --line:rgba(60,60,67,.11);
  --peri:#5d6cf0; --peri-tint:#eceefe; --field:#f1f2f8;
  --mint:#2e9e74; --mint-tint:#e4f5ee;
  --apricot:#c7772a; --apricot-tint:#fdf0e1;
  --blush:#c9504d; --blush-tint:#fce9e8;
  --lav:#efebfd; --lav-ink:#4b3fb8;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
.page{max-width:600px;margin:0 auto;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px}
.state{font-size:13px;font-weight:600;border-radius:999px;padding:5px 11px;border:0;background:transparent;color:var(--ink3)}
.state.saved{background:var(--mint-tint);color:var(--mint)}
.state.saving{background:var(--peri-tint);color:var(--peri)}
.state.err{background:var(--blush-tint);color:var(--blush);cursor:pointer}
.tools{display:flex;gap:8px}
.icon{width:38px;height:38px;border-radius:50%;border:0;background:var(--card);color:var(--peri);
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;box-shadow:0 1px 2px rgba(29,29,31,.06)}
.icon svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:34px;line-height:1.08;font-weight:700;letter-spacing:.3px;margin:10px 0 4px}
.sub{color:var(--ink2);font-size:15px;margin:0 0 16px}

/* currency switch */
.seg{display:flex;background:#e6e8f1;border-radius:11px;padding:2px;margin:0 0 6px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:36px;font-size:15px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(29,29,31,.12)}
.rate{font-size:13px;color:var(--ink3);margin:0 4px 18px}
.rate-b{border:0;background:transparent;padding:0;font:inherit;font-weight:600;color:var(--peri);cursor:pointer;font-variant-numeric:tabular-nums}

/* order list, Apple inset grouped style */
.group{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(29,29,31,.04)}
.item{padding:14px 16px;position:relative}
.item + .item::before,.ship::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nm{font-weight:600;font-size:17px}
.pill{flex:none;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--field);color:var(--ink2)}
.ctrls{display:flex;align-items:flex-end;gap:10px;margin-top:10px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px}
.fld .cap{font-size:12px;color:var(--ink3);padding-left:2px}
.step,.money{color:var(--ink)}
.step{display:flex;align-items:center;background:var(--field);border-radius:11px;height:40px}
.step button{width:38px;height:40px;border:0;background:transparent;color:var(--peri);font-size:22px;line-height:1;cursor:pointer;border-radius:11px}
.step button:active{background:var(--peri-tint)}
.step input{width:48px;height:40px;border:0;background:transparent;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:17px}
.money{display:flex;align-items:center;background:var(--field);border-radius:11px;height:40px;padding:0 10px}
.money b{color:var(--ink3);font-weight:500;margin-right:2px}
.money input{width:74px;height:40px;border:0;background:transparent;font-variant-numeric:tabular-nums;font-size:17px}
.money input::placeholder{color:var(--peri);opacity:.8}
.line{margin-left:auto;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:17px;padding-bottom:9px}
input:focus{outline:none}
.step:focus-within,.money:focus-within{box-shadow:0 0 0 2px var(--peri)}
.ship{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;position:relative}
.ship .nm{font-weight:500}
.ship small{display:block;font-size:13px;color:var(--ink3)}

/* total, the one standout piece */
.total{background:var(--lav);border-radius:var(--r);padding:18px 18px 16px;margin-top:16px}
.total .lbl{font-size:15px;color:var(--lav-ink);font-weight:600}
.total .big{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  font-size:40px;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 4px;color:var(--ink)}
.total .alt{font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums}
.total .rows{margin-top:12px;border-top:.5px solid rgba(75,63,184,.15);padding-top:10px}
.total .row{display:flex;justify-content:space-between;font-size:15px;color:var(--ink2);padding:2px 0;font-variant-numeric:tabular-nums}

.cta{display:block;width:100%;height:52px;margin-top:16px;border:0;border-radius:14px;background:var(--peri);color:#fff;font-size:17px;font-weight:600;cursor:pointer}
.cta:active{opacity:.88}
.cta:disabled{opacity:.6}
.ghost{display:block;margin:12px auto 0;border:0;background:transparent;color:var(--peri);font-size:15px;font-weight:500;cursor:pointer;padding:8px 12px}

.msg{background:var(--card);border-radius:var(--r);padding:30px 22px;text-align:center}
.msg svg{width:44px;height:44px;margin-bottom:8px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.msg h2{font-size:19px;margin:0 0 6px}
.msg p{margin:0;color:var(--ink2);font-size:15px}
.msg.ok svg{stroke:var(--mint)}
.msg.bad svg{stroke:var(--apricot)}
.skel{height:92px;border-radius:var(--r);background:var(--card);margin-bottom:10px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.8}50%{opacity:.45}}

/* packaging and designs */
.group.pk,.group.dz{margin-top:16px}
.group.dz{margin-top:22px}
.pk-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;position:relative}
.pk-head .nm{font-weight:600}
.pk-head small{display:block;font-size:13px;color:var(--ink3)}
.group .empty{position:relative}
.pk-head + .item::before,.pk-head + .opt::before,.pk-head + .empty::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.sw{flex:none;position:relative;width:51px;height:31px;border-radius:999px;border:0;padding:0;background:#e3e4ea;cursor:pointer;transition:background .2s}
.sw span{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:transform .2s}
.sw.on{background:var(--mint)}
.sw.on span{transform:translateX(20px)}
button.pill{border:0;cursor:pointer;font-family:inherit}
.opt.fl .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
.fnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fth{flex:none;width:44px;height:44px;border-radius:9px;object-fit:cover;background:var(--field)}
.fth.ext{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:.3px;color:var(--peri);background:var(--peri-tint)}
.fth.ext.big{width:96px;height:96px;border-radius:20px;font-size:20px}
.opt.fl.up{opacity:.6;cursor:default}
.pv{display:flex;align-items:center;justify-content:center;min-height:160px;background:var(--card);border-radius:var(--r);padding:12px;margin:4px 0 0}
.pv img{display:block;max-width:100%;max-height:55vh;border-radius:10px}
.pv-wait{color:var(--ink3);font-size:15px}
.cta.lnk{display:flex;align-items:center;justify-content:center;text-decoration:none}
.cta.lnk.off{opacity:.5;pointer-events:none}

/* sign in, centred and plain */
body.out .top,body.out h1,body.out .sub{display:none}
body.out .page{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:center}
.si{width:100%;max-width:340px;margin:0 auto 8vh;text-align:center}
.si-ic{width:64px;height:64px;border-radius:18px;background:var(--peri);color:#fff;display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:14px;box-shadow:0 6px 18px rgba(93,108,240,.28)}
.si-ic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.si h2{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;font-size:28px;font-weight:700;letter-spacing:.2px;margin:0 0 22px}
.si-pw{display:block;width:100%;height:54px;border:0;border-radius:14px;background:var(--card);box-shadow:0 1px 2px rgba(29,29,31,.06);
  text-align:center;font-size:22px;letter-spacing:4px;padding:0 16px}
.si-pw::placeholder{letter-spacing:normal;font-size:17px;color:var(--ink3)}
.si-pw:focus{box-shadow:0 0 0 2px var(--peri)}
.si-err{color:var(--blush);font-size:15px;min-height:22px;margin:10px 0 2px}
.si .cta{margin-top:6px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:rgba(29,29,31,.9);color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;
  opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;z-index:30}
.toast.on{opacity:1}
.mask.on ~ .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:2px solid var(--peri);outline-offset:2px}
/* status */
.stat{background:var(--card);border-radius:var(--r);padding:16px;margin:0 0 14px;box-shadow:0 1px 2px rgba(29,29,31,.04)}
.stat-lbl{font-size:13px;color:var(--ink3)}
.stat-now{font-size:22px;font-weight:700;margin-top:2px}
.stat-when{font-size:13px;color:var(--ink2);margin-top:2px}
.prog{display:flex;gap:4px;margin:12px 0 2px}
.prog span{flex:1;height:6px;border-radius:3px;background:#e6e8f1}
.prog span.on{background:#7fd1ae}
.stat-acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tint{border:0;background:var(--peri-tint);color:var(--peri);font-weight:600;font-size:15px;border-radius:12px;min-height:40px;padding:0 16px;cursor:pointer}
.cta.mint{background:#1f8a5f;margin-top:14px}
/* whatsapp nudge */
.wa{background:#e2f5ea;border-radius:var(--r);padding:14px 16px;margin:0 0 14px;color:#1d5c3f}
.wa p{margin:0 0 10px;font-size:15px;font-weight:600}
.wa-row{display:flex;gap:10px;align-items:center}
.wa-btn{flex:1;display:flex;align-items:center;justify-content:center;height:44px;border-radius:12px;background:#1f8a5f;color:#fff;font-weight:600;text-decoration:none}
.wa-x{border:0;background:transparent;color:#1d5c3f;font-size:15px;cursor:pointer;padding:8px}
/* add and remove */
.hr{display:flex;align-items:center;gap:8px;flex:none}
.x{width:28px;height:28px;border-radius:50%;border:0;background:var(--field);color:var(--ink3);font-size:18px;line-height:1;cursor:pointer}
.pill.add{background:var(--peri-tint);color:var(--peri)}
.addrow{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--peri);font-size:17px;font-weight:500;padding:14px 16px;cursor:pointer;position:relative}
.addrow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.empty{padding:16px;color:var(--ink2);font-size:15px}
/* sheets */
.mask{position:fixed;inset:0;background:rgba(29,29,31,.28);display:none;align-items:flex-end;justify-content:center;z-index:20}
.mask.on{display:flex}
.sheet{position:relative;background:var(--canvas);width:100%;max-width:600px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.mask{align-items:center}.sheet{border-radius:20px}.mask.on ~ .toast{bottom:calc(7vh + 96px)}}
.sheet h2{font-size:22px;margin:4px 0 4px}
.sh-sub{color:var(--ink2);font-size:15px;margin:0 0 12px}
.sheet-x{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:0;background:#e6e8f1;color:var(--ink2);font-size:20px;cursor:pointer}
.opts{background:var(--card);border-radius:var(--r);overflow:hidden}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:13px 16px;font-size:17px;cursor:pointer;position:relative}
.opt + .opt::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.opt .ck{width:18px;flex:none;color:var(--mint);font-weight:700}
.opt .ot{flex:1}
.opt .om{font-size:13px;color:var(--ink3)}
.opt.cur .ot{font-weight:700}
.opt.new .ot{color:var(--peri)}
.srch{margin:10px 0 12px}
.sheet h2.ask{font-size:20px;line-height:1.3;margin:6px 44px 4px 0}
.srch input{width:100%;height:44px;border:0;border-radius:12px;background:#e6e8f1;padding:0 14px;font-size:17px}
/* picking from the price list */
.sheet.picker{padding-bottom:0}
.srch.stick{position:sticky;top:-18px;z-index:2;background:var(--canvas);margin:0 -16px 2px;padding:12px 16px 10px}
.opt.pl .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid #c7c7cc;display:inline-flex;align-items:center;justify-content:center;font-size:13px;line-height:1;color:#fff}
.opt.pl.on .ck{background:var(--mint);border-color:var(--mint)}
.opt.pl .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt.pl .om{line-height:1.3}
.opt.pl .pr{flex:none;font-size:15px;color:var(--ink2);font-variant-numeric:tabular-nums}
.opt.pl.on .ot > span:first-child{font-weight:600}
.donebar{position:sticky;bottom:0;z-index:2;margin:0 -16px;padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to bottom,rgba(244,245,250,0),var(--canvas) 16px)}
.donebar .cta{margin-top:0}

.si-row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:52px}
.si-row .cap{font-size:17px;flex:none}
.si-row + .si-row{border-top:.5px solid var(--line)}
.si-row input{flex:1;min-width:0;border:0;background:transparent;height:52px;font-size:17px;text-align:right}
.si-row input::placeholder{color:var(--ink3)}
/* save for later, saved orders, compare */
.acts3{display:flex;gap:8px;margin-top:14px}
.acts3 .tint{flex:1;min-width:0;padding:0 6px;font-size:15px;min-height:44px}
.tint.wide{display:block;width:100%;margin-top:10px;min-height:50px;font-size:17px}
.ghost.danger{color:var(--blush)}
.opt.sv .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt.sv .ot b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-t{font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.sv-line{display:flex;align-items:baseline;gap:10px;padding:12px 16px;position:relative}
.sv-line + .sv-line::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.sv-line .nm{flex:1;min-width:0;font-size:16px}
.sv-q{color:var(--ink2);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sv-v{font-weight:600;font-variant-numeric:tabular-nums;min-width:82px;text-align:right;white-space:nowrap}
.pick{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:0 12px;margin:0 0 8px;min-height:48px;position:relative}
.pick::after{content:"";position:absolute;right:16px;top:50%;width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ab{flex:none;width:24px;height:24px;border-radius:50%;background:var(--peri-tint);color:var(--peri);font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.pick select{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;height:46px;color:var(--ink);-webkit-appearance:none;appearance:none;padding-right:26px;cursor:pointer}
.cmp{margin-top:12px}
.cmp-cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 16px 0}
.cmp-row{padding:12px 16px;position:relative}
.cmp-row + .cmp-row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--line)}
.cmp-nm{font-weight:600;font-size:16px;margin-bottom:6px}
.cmp-cells{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp-c{background:var(--field);border-radius:10px;padding:8px 10px;min-width:0}
.cmp-c.win{background:var(--mint-tint)}
.cmp-c .q{display:block;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-c .v{display:block;font-weight:600;font-variant-numeric:tabular-nums}
.cmp-c.none .v{color:var(--ink3);font-weight:500;font-size:15px}
.cmp-d{font-size:13px;color:var(--ink2);margin-top:6px}
.cmp-d.good{color:var(--mint);font-weight:600}
.cmp-tot .cmp-tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:15px;color:var(--ink2);padding:3px 0;font-variant-numeric:tabular-nums}
.cmp-tot .cmp-tr span + span{text-align:right}
.cmp-tot .cmp-tr.th span{font-weight:700;color:var(--lav-ink)}
.cmp-tot .cmp-tr.tot{color:var(--ink);font-weight:700;font-size:17px;border-top:.5px solid rgba(75,63,184,.15);margin-top:6px;padding-top:8px}
.cmp-v{font-size:21px;font-weight:700;margin-top:12px;color:var(--ink)}
.cmp-note{font-size:14px;color:var(--ink2);margin:6px 0 0}
@media (prefers-reduced-motion:reduce){.icon.spin svg,.skel{animation:none}.toast,.sw,.sw span{transition:none}}
</style>
</head>
<body class="out">
<main class="page">
  <div class="top">
    <button class="state" id="state" type="button" aria-live="polite"></button>
    <div class="tools" id="tools">
      <button class="icon" id="refresh" type="button" aria-label="Refresh" title="Refresh">
        <svg viewBox="0 0 24 24"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 3.5V9H15"/></svg>
      </button>
      <button class="icon" id="signout" type="button" aria-label="Sign out" title="Sign out">
        <svg viewBox="0 0 24 24"><rect x="4.5" y="11" width="15" height="10" rx="2.5"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
      </button>
    </div>
  </div>
  <h1>PPR Logistics</h1>
  <p class="sub" id="sub">Order from the 12 May 2026 price list</p>
  <div id="body"></div>
</main>
<div class="mask" id="mask"><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Order options"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
// Never run inside another site's page.
if (window.top !== window.self) { try { window.top.location = window.self.location; } catch (e) { document.documentElement.innerHTML = ""; } }

/* PPR Logistics order. Pick from the price list in this file, set the amounts and it adds it all up.
   The order, the saved orders and the AUD rate live on the Google script, so every phone and computer
   sees the same thing, and a change on one shows on the others within about 10 seconds. It needs the
   password to open and signs itself out after 8 hours. The password is never in this file; it sits in
   the script's own settings. Money is kept in USD and shown in USD or AUD. */
(function () {

  /* ---------- the order on screen ---------- */

  function autoBoxes() { var n = 0; D.items.forEach(function (it) { if (it.qty > 0) n += Math.ceil(it.qty / (it.box || 10)); }); return n; }

  /* ---------- saved orders and compare ----------

  function curLines() {

  function cell(x, win) {

  /* ---------- designs ----------

  function sizeText(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }

      return '<button type="button" class="opt fl" data-file="' + esc(f.id) + '">' + th +
        '<span class="ot"><span class="fnm">' + esc(f.name) + '</span><span class="om">' + esc(sizeText(+f.size || 0) + ", " + fmtDay(f.at)) + '</span></span></button>';

    }).join("");

  function drawFiles() { var box = $("dzBox"); if (box) box.innerHTML = filesHtml(); }

      if (j && j.ok) { FILES = j.files || []; drawFiles(); }
      else if (j && j.error === "signed_out") signOut();
    }).catch(function () {}).then(function () { filesBusy = false; });
  }
  function readB64(file) {
    return new Promise(function (res, rej) {
      var r = new FileReader();
      r.onload = function () { var s = String(r.result || ""); res(s.slice(s.indexOf(",") + 1)); };
      r.onerror = function () { rej(new Error("read")); };

    });
  }
  function makeThumb(file) {
    return new Promise(function (res) {
      if (!/^image\//.test(file.type || "") || !window.URL) return res("");
      var url = URL.createObjectURL(file), img = new Image(), done = false;
      function end(v) { if (done) return; done = true; try { URL.revokeObjectURL(url); } catch (e) {} res(v); }

        try {

          var d = c.toDataURL("image/jpeg", 0.72); end(d.length < 60000 ? d : "");

  function upload(list) {

    var ok = list.filter(function (f) { if (f.size > MAXUP) { toast(f.name + " is over 15 MB, upload a smaller copy"); return false; } return f.size > 0; });
    if (!ok.length) return;

    if (b.dataset["new"]) return addNew($("addQ").value);
    if (b.dataset.cur) {
      CUR = b.dataset.cur; try { localStorage.setItem(K.cur, CUR); } catch (err) {}
      return render();
    }
    var act = b.dataset.act; if (!act || !D) return;
    if (act === "remove") return removeRow(b);
    var it = itemOf(b); if (!it) return;
    var step = it.box || 10;
    queue({ t: "qty", id: it.id, k: it.k, v: act === "plus" ? it.qty + step : Math.max(0, it.qty - step) });
    var row = document.querySelector('.item[data-id="' + it.id + '"]'), now = byId(it.id);
    if (row && now) row.querySelector('[data-f="qty"]').value = now.qty;
    totals();
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "addQ") return addSearch();
    var ds = e.target.dataset || {};
    if (D && ds.pq) { queue({ t: "pqty", f: ds.pq, v: e.target.value.trim() === "" ? null : Math.round(num(e.target.value)) }); return totals(); }
    if (D && ds.pf) { queue({ t: "pprice", f: ds.pf, v: r4(toAud(num(e.target.value))) }); return totals(); }
    var f = ds.f; if (!f || !D) return;
    if (f === "ship") queue({ t: "ship", v: r4(toUsd(num(e.target.value))) });
    else {
      var it = itemOf(e.target); if (!it) return;
      if (f === "qty") queue({ t: "qty", id: it.id, k: it.k, v: Math.round(num(e.target.value)) });
      if (f === "price") queue({ t: "price", id: it.id, k: it.k, v: r4(toUsd(num(e.target.value))) });
    }
    totals();
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "cmpA" || e.target.id === "cmpB") { CMP[e.target.id === "cmpA" ? "a" : "b"] = e.target.value; return drawCompare(); }
    if (e.target.id === "upIn") { upload(e.target.files); e.target.value = ""; return; }
    var ds = e.target.dataset || {};
    if (D && ds.pq) { e.target.value = packNow()[ds.pq]; return; }
    if (D && ds.pf) { e.target.value = ds.pf === "ship" ? fixAud(PR.ship) : unitNum(showAud(PR[ds.pf])); return; }
    var f = ds.f; if (!f || !D) return;
    if (f === "ship") { e.target.value = fix(D.shipUsd); return; }
    var it = itemOf(e.target); if (!it) return;
    e.target.value = f === "qty" ? it.qty : (it.price > 0 ? fix(it.price) : "");
  });
  // Something changed on another device while a box here was being typed in, so redraw once typing stops.
  document.addEventListener("focusout", function () {
    clearTimeout(rendT);
    rendT = setTimeout(function () { if (NEEDR && !typing()) render(); }, 400);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") return closeSheet();
    if (e.key === "Enter" && e.target.id === "svName") { e.preventDefault(); return doSaveFor(); }
    if (e.key === "Enter" && e.target.id === "rateIn") { e.preventDefault(); return saveRate(); }
    if (e.key === "Enter" && e.target.id === "addQ") {
      e.preventDefault();
      var q = e.target.value.trim(), m = addMatches(q);
      if (q && m.length === 1) {
        if (onOrder(m[0].k) < 0) togglePk(m[0].k); else toast(m[0].name + " is already on the order");
        e.target.value = ""; addSearch();
      } else if (q && !m.length) addNew(q);
      else e.target.blur();
    }
  });
  // Phones pause timers in the background, so check the 8 hours and catch up whenever the page comes back.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { clearTimeout(pollT); if (Q.length && !INF) send(true); return; }
    if (AUTH && !signedIn()) return signOut();
    if (signedIn()) { if (Q.length && !INF) send(); load(false); }
  });
  window.addEventListener("pagehide", function () { if (Q.length && !INF && signedIn()) send(true); });
  window.addEventListener("online", function () { if (signedIn()) { if (Q.length && !INF) send(); load(false); } });
  window.__log = { waMsg: function (k) { return waMsg(k); }, sums: function () { return sums(); }, saves: function () { return SAVES; },
    order: function () { return D; }, v: function () { return V; }, pending: function () { return Q.length + (INF ? INF.length : 0); } };

  if (!LIVE) {
    document.body.classList.remove("out"); $("tools").style.visibility = "hidden";
    note("bad", "Not connected yet", "This page needs its Google script link added.");
  } else if (signedIn()) { document.body.classList.remove("out"); armExpiry(); load(false); if (Q.length) send(); }
  else signOut();
})();
